specVersion: 1.0.0
schema:
  file: ../schema.graphql
indexerHints:
  prune: never
dataSources:
  # BEGIN AUTO CONVERT EVENT COVERAGE
  - kind: ethereum/contract
    name: AutoConvertEvents
    network: base
    source:
      address: "0xD1A0D188E861ed9d15773a2F3574a2e94134bA8f"
      abi: PintoAutoConvert
      startBlock: 22622961
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AutoConvertActivatedRecord
        - AutoConvertConfigurationVersionRecord
        - AutoConvertConfiguredRecord
        - AutoConvertDecisionRecord
        - AutoConvertEndedRecord
        - AutoConvertExecutionSummaryRecord
        - AutoConvertFeePolicyBoundRecord
        - AutoConvertFlowEnabledRecord
        - AutoConvertFlowSampleRecord
        - AutoConvertFlowStateRecord
        - AutoConvertFlowWindowUpdatedRecord
        - AutoConvertLaunchCreditAppliedRecord
        - AutoConvertOracleDetailRecord
        - AutoConvertOutflowPauseChangedRecord
        - AutoConvertParametersRecord
        - AutoConvertPauseChangedRecord
        - AutoConvertPegConfirmedRecord
        - AutoConvertPolicyConfiguredRecord
        - AutoConvertPositionFloorSetRecord
        - AutoConvertPriorityFloorSetRecord
        - AutoConvertPriorityProgressRecord
        - AutoConvertResetPauseDurationConfiguredRecord
        - AutoConvertResetPauseExpiredRecord
        - AutoConvertResetPauseStartedRecord
        - AutoConvertResetPolicyConfiguredRecord
        - AutoConvertRewardFundedRecord
        - AutoConvertRewardWithdrawnRecord
        - AutoConvertScheduleDeferredRecord
        - AutoConvertScheduleResetRecord
        - AutoConvertScheduleStartedRecord
        - AutoConvertWellConfiguredRecord
        - AutoConvertWellOracleRecord
        - AutoConvertWellPlanRecord
        - AutoConvertWellPolicyRecord
        - AutoConvertWhitelistChangedRecord
        - DepositGrownStalkAdjustmentRecord
        - OrderedDepositInsertedRecord
        - OrderedDepositRemovedRecord
        - OrderedDepositsEnabledRecord
