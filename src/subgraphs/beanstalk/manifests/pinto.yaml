      language: wasm/assemblyscript
      entities:
        - AutoConvertBatchRecord
        - AutoConvertPositionRecord
        - AutoConvertWellRecord
        - SunriseAutoConvertAttemptRecord
        - AutoConvertFlowBaselineRecord
        - AutoConvertFlowObservationRecord
      abis:
        - name: PintoAutoConvert
          file: ../../../core/abis/Beanstalk/Pinto-AutoConvert.json
      eventHandlers:
        - event: AutoConvertBatch(indexed uint32,indexed uint32,uint256,uint256,address,uint256)
