        - event: SiloDepositsRedeemedToPairedToken(indexed address,indexed address,indexed address,uint256,uint256,uint8)
          handler: handleSiloDepositsRedeemedToPairedToken
        - event: SiloPintoDepositsSwapped(indexed address,indexed address,indexed address,uint256,uint256,uint8)
          handler: handleSiloPintoDepositsSwapped
        - event: SiloRedemptionInitialized(indexed address,uint96,uint32)
          handler: handleSiloRedemptionInitialized
        - event: SiloRedemptionWellEnabled(indexed address)
          handler: handleSiloRedemptionWellEnabled
