          handler: handleAutoConvertResetPolicyConfigured
        - event: AutoConvertRewardFunded(indexed address,uint256)
          handler: handleAutoConvertRewardFunded
        - event: AutoConvertRewardWithdrawn(indexed address,uint256)
          handler: handleAutoConvertRewardWithdrawn
        - event: AutoConvertScheduleDeferred(indexed uint32,indexed uint32,uint8)
          handler: handleAutoConvertScheduleDeferred
        - event: AutoConvertScheduleReset(indexed uint32,indexed uint32,uint256,uint256,uint256,uint256,uint16)
          handler: handleAutoConvertScheduleReset
        - event: AutoConvertScheduleStarted(indexed uint32,indexed uint32,uint256,uint256,uint256)
          handler: handleAutoConvertScheduleStarted
        - event: AutoConvertWellConfigured(indexed address,uint256,uint256)
          handler: handleAutoConvertWellConfigured
        - event: AutoConvertWellOracle(indexed uint32,indexed uint32,indexed address,bool,int256,uint256)
          handler: handleAutoConvertWellOracle
        - event: AutoConvertWellPlan(indexed uint32,indexed uint32,indexed address,uint256,uint256,uint256,uint256,uint8)
          handler: handleAutoConvertWellPlan
        - event: AutoConvertWellPolicy(indexed uint32,indexed uint32,indexed address,uint256,uint256,bytes32)
          handler: handleAutoConvertWellPolicy
        - event: AutoConvertWhitelistChanged(indexed address,uint32)
          handler: handleAutoConvertWhitelistChanged
        - event: DepositGrownStalkAdjustment(indexed address,indexed uint256,int256)
          handler: handleDepositGrownStalkAdjustment
        - event: OrderedDepositInserted(indexed address,indexed bytes32,indexed address,int96,bytes32,bytes32)
          handler: handleOrderedDepositInserted
        - event: OrderedDepositRemoved(indexed address,indexed bytes32)
          handler: handleOrderedDepositRemoved
        - event: OrderedDepositsEnabled(indexed address)
          handler: handleOrderedDepositsEnabled
        - event: SiloDepositsRedeemed(indexed address,indexed address,uint256,uint256,uint8)
