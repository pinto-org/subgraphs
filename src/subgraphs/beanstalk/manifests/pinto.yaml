  # END AUTO CONVERT EVENT COVERAGE
  # Event-only additions are safe before activation: no new getters are called.
  - kind: ethereum/contract
    name: AutoConvert
    network: base
    source:
      address: "0xD1A0D188E861ed9d15773a2F3574a2e94134bA8f"
      abi: PintoAutoConvert
      startBlock: 22622961
    mapping:
      kind: ethereum/events
