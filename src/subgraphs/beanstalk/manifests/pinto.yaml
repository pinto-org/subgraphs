        - SiloDepositsRedeemedToPairedTokenRecord
        - SiloPintoDepositsSwappedRecord
        - SiloRedemptionInitializedRecord
        - SiloRedemptionWellEnabledRecord
        - AutoConvertProgram
        - AutoConvertController
        - AutoConvertWellState
        - DepositGrownStalkState
      abis:
        - name: PintoAutoConvert
          file: ../../../core/abis/Beanstalk/Pinto-AutoConvert.json
      eventHandlers:
        - event: AutoConvertActivated(indexed uint32,indexed uint32,uint40)
          handler: handleAutoConvertActivated
        - event: AutoConvertConfigurationVersion(indexed uint32,uint32)
          handler: handleAutoConvertConfigurationVersion
        - event: AutoConvertConfigured(indexed uint32,indexed uint32,address[])
          handler: handleAutoConvertConfigured
        - event: AutoConvertDecision(indexed uint32,indexed uint32,uint32,uint8,uint8,address,uint256,uint256)
          handler: handleAutoConvertDecision
        - event: AutoConvertEnded(indexed uint32,uint256)
          handler: handleAutoConvertEnded
        - event: AutoConvertExecutionSummary(indexed uint32,indexed uint32,uint32,uint8,uint256,uint256,uint256,bool)
          handler: handleAutoConvertExecutionSummary
        - event: AutoConvertFeePolicyBound(indexed address,indexed address,uint256,uint256)
          handler: handleAutoConvertFeePolicyBound
        - event: AutoConvertFlowEnabled(uint8)
          handler: handleAutoConvertFlowEnabled
        - event: AutoConvertFlowSample(indexed uint32,indexed address,uint40,int256,uint256,uint256,int256)
          handler: handleAutoConvertFlowSample
        - event: AutoConvertFlowState(indexed uint32,indexed uint32,uint32,uint8,uint256,uint256,bool,bool,bool,uint256,uint256)
          handler: handleAutoConvertFlowState
        - event: AutoConvertFlowWindowUpdated(uint40,uint40,int256,int256,bool)
          handler: handleAutoConvertFlowWindowUpdated
        - event: AutoConvertLaunchCreditApplied(indexed uint32,uint256,uint256)
          handler: handleAutoConvertLaunchCreditApplied
        - event: AutoConvertOracleDetail(indexed uint32,indexed address,uint8,uint256,uint256,uint256)
          handler: handleAutoConvertOracleDetail
        - event: AutoConvertOutflowPauseChanged(indexed uint32,bool,uint256,uint256)
          handler: handleAutoConvertOutflowPauseChanged
        - event: AutoConvertParameters(indexed uint32,indexed uint32,uint256,uint256,uint256)
          handler: handleAutoConvertParameters
        - event: AutoConvertPauseChanged(indexed uint32,bool)
          handler: handleAutoConvertPauseChanged
        - event: AutoConvertPegConfirmed(indexed uint32,uint40,uint40)
          handler: handleAutoConvertPegConfirmed
        - event: AutoConvertPolicyConfigured(indexed uint32,(uint16,uint256,uint256))
          handler: handleAutoConvertPolicyConfigured
        - event: AutoConvertPositionFloorSet(indexed uint32,indexed uint32,uint256,uint256,bool)
          handler: handleAutoConvertPositionFloorSet
        - event: AutoConvertPriorityFloorSet(indexed uint32,uint256)
          handler: handleAutoConvertPriorityFloorSet
        - event: AutoConvertPriorityProgress(indexed uint32,indexed address,bool,bytes32,address,int96,uint256,bool)
          handler: handleAutoConvertPriorityProgress
        - event: AutoConvertResetPauseDurationConfigured(indexed uint32,uint32)
          handler: handleAutoConvertResetPauseDurationConfigured
        - event: AutoConvertResetPauseExpired(indexed uint32,uint40)
          handler: handleAutoConvertResetPauseExpired
        - event: AutoConvertResetPauseStarted(indexed uint32,indexed uint32,uint40,uint40,uint40)
