        - event: AutoConvertFlowBaseline(indexed uint32,bool,uint256,uint256)
          handler: handleAutoConvertFlowBaseline
        - event: AutoConvertFlowObservation(indexed uint32,uint8,uint256,uint256,uint256,uint256)
          handler: handleAutoConvertFlowObservation
      file: ../src/handlers/AutoConvertHandler.ts
  ###
  # INITIALIZATION
  ###
  - kind: ethereum/contract
